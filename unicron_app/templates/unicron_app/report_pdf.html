<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Отчёт по группам</title>
  <style>
    body { font-family: DejaVu Sans, sans-serif; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid black; padding: 5px; text-align: left; }
    th { background-color: #eee; }
  </style>
</head>
<body>
  <h1>Сводка по группам IT-школы «Юникрон»</h1>
  <table>
    <thead><tr><th>Группа</th><th>Направление</th><th>Студентов</th></tr></thead>
    <tbody>
      {% for g in groups %}
        <tr>
          <td>{{ g.title }}</td>
          <td>{{ g.direction.title }}</td>
          <td>{{ g.students.count }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
