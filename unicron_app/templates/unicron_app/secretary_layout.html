{% extends "unicron_app/base.html" %}

{% block title %}Кабинет секретаря{% endblock %}

{% block extra_css %}
<style>
    .secretary-wrapper {
        display: flex;
        flex: 1;
    }
    .sidebar {
        width: 230px;
        background-color: #f8f9fa;
        padding: 1.5rem 1rem;
        border-left: 1px solid #dee2e6;
        flex-shrink: 0;
    }
    .sidebar .nav-link {
        color: #333;
        padding: 0.5rem 0.75rem;
        border-radius: 0.25rem;
        margin-bottom: 0.25rem;
    }
    .sidebar .nav-link.active {
        background-color: #0d6efd;
        color: white;
    }
    .content {
        flex: 1;
        padding: 1.5rem;
    }
    @media (max-width: 768px) {
        .secretary-wrapper {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            border-left: none;
            border-top: 1px solid #dee2e6;
        }
    }
</style>
{% endblock %}

{% block outer_content %}
<div class="secretary-wrapper">
    <!-- Основной контент (слева) -->
    <main class="content">
        {% block secretary_content %}{% endblock %}
    </main>

    <!-- Боковое меню (справа) -->
    <nav class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'today' %}active{% endif %}" href="{% url 'unicron_app:secretary_today' %}">
                    📅 Сегодня
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'schedule' %}active{% endif %}" href="{% url 'unicron_app:secretary_schedule_week' %}">
                    📆 Расписание
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'groups' %}active{% endif %}" href="{% url 'unicron_app:secretary_groups' %}">
                    👥 Группы
                </a>
            </li>
            <li class="nav-item mt-3">
                <form method="post" action="{% url 'unicron_app:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link text-danger" style="border:none; background:none; padding-left:0;">
                        🚪 Выйти
                    </button>
                </form>
            </li>
        </ul>
    </nav>
</div>
{% endblock %}
