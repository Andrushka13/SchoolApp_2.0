<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёт</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            font-size: 12pt;
        }
        h1 { font-size: 16pt; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 6px; text-align: left; }
        th { background-color: #eee; }
    </style>
</head>
<body>
    <h1>Сводка по группам IT-школы «Юникрон»</h1>
    <table>
        <thead>
            <tr>
                <th>Группа</th>
                <th>Направление</th>
                <th>Студентов</th>
            </tr>
        </thead>
        <tbody>
            {% for g in groups %}
                <tr>
                    <td>{{ g.title }}</td>
                    <td>{{ g.direction.title }}</td>
                    <td>{{ g.students.count }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
