<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}АИС Юникрон{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand mx-auto" href="{% url 'unicron_app:dashboard' %}">IT-Школа Юникрон</a>
        </div>
    </nav>

    {% if user.is_authenticated %}
        <div style="text-align: center; padding: 12px 20px; background-color: #e9ecef; border-bottom: 1px solid #dee2e6;">
            <h2 style="margin: 0; font-size: 1.4rem;">{{ greeting }}</h2>
            <h3 style="margin: 5px 0 0; font-size: 1.1rem; font-weight: normal;">Сегодня: {{ today|date:"d.m.Y" }}, {{ today|date:"l" }}</h3>
        </div>
    {% endif %}

    {% block outer_content %}
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
